name: Auto Obfuscate edgetunnel

on:
  # 1. 推送代码时触发
  push:
    branches:
      - main
  # 2. 自动执行
  schedule:
    - cron: "0 6 * * *" 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 设置 Node.js 环境
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      # 2. 安装混淆工具
      - name: Install obfuscator
        run: npm install -g javascript-obfuscator

      # 3. 拉取最新 _worker.js
      - name: Download Source File
        run: |
          wget -O origin.js https://raw.githubusercontent.com/cokyrain/edgetunnel/main/_worker.js

      # 4. 执行轻量级混淆操作
      - name: Obfuscate JS
        run: |
          javascript-obfuscator origin.js --output _worker.js \
          --compact true \
          --string-array true \
          --string-array-encoding 'base64' \
          --string-array-threshold 0.75 \
          --identifier-names-generator hexadecimal \
          --rename-globals true \
          --transform-object-keys true

      # 5. 强制提交并推送到当前仓库（直接覆盖）
      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          commit_message: '🤖 Auto obfuscate'
          file_pattern: _worker.js
          skip_checkout: true   # 跳过检出旧文件
          skip_fetch: true      # 跳过拉取远程状态
